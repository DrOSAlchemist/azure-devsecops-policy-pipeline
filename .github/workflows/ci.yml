name: DevSecOps gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run audit

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - name: Mock-provider infrastructure tests (no Azure authentication)
        run: |
          mkdir -p reports
          terraform -chdir=infra test -verbose -json > reports/terraform-test.jsonl
          node scripts/extract-plan.js reports/terraform-test.jsonl reports/plan.json
      - name: Install checksum-verified OPA
        env:
          OPA_VERSION: "1.21.2"
        run: bash scripts/install-opa.sh
      - run: .tools/opa test policy -v
      - name: Enforce policy on generated mock plan
        run: |
          .tools/opa eval --fail --data policy/terraform.rego --input reports/plan.json 'data.terraform.guardrails.allow == true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: infrastructure-evidence
          path: reports/
          retention-days: 7

  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-security.txt
      - name: Scan infrastructure and container configuration
        run: |
          mkdir -p reports
          checkov --directory . --framework terraform dockerfile --output cli --output junitxml --output-file-path console,reports/checkov.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checkov-evidence
          path: reports/
          retention-days: 7

  filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: trivy-filesystem.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: filesystem-evidence
          path: trivy-filesystem.json
          retention-days: 7

  snyk:
    if: vars.SNYK_ENABLED == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned Snyk CLI
        run: npm install --global snyk@1.1303.1 --ignore-scripts
      - name: Require credentials and run enabled gates
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN" || { echo "::error::SNYK_ENABLED requires SNYK_TOKEN"; exit 1; }
          mkdir -p reports
          snyk test --severity-threshold=high --json-file-output=reports/snyk-dependencies.json
          snyk iac test infra --severity-threshold=high --json-file-output=reports/snyk-iac.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: snyk-evidence
          path: reports/
          retention-days: 7

  image:
    needs: [application, infrastructure, checkov, filesystem, snyk]
    if: >-
      always() && !cancelled() &&
      needs.application.result == 'success' &&
      needs.infrastructure.result == 'success' &&
      needs.checkov.result == 'success' &&
      needs.filesystem.result == 'success' &&
      (needs.snyk.result == 'success' ||
       (needs.snyk.result == 'skipped' &&
        (vars.SNYK_ENABLED != 'true' || github.event_name == 'pull_request')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: devsecops-demo:${{ github.sha }}
      - name: Smoke-test non-root read-only image
        env:
          IMAGE: devsecops-demo:${{ github.sha }}
        run: |
          set -euo pipefail
          id=$(docker run -d --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=100 -p 127.0.0.1:8080:8080 "$IMAGE")
          trap 'docker logs "$id"; docker stop "$id"' EXIT
          test "$(docker exec "$id" id -u)" != "0"
          curl --fail --retry 12 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/healthz
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.0
          image-ref: devsecops-demo:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: trivy-image.json
      - name: Generate CycloneDX SBOM
        env:
          IMAGE: devsecops-demo:${{ github.sha }}
        run: trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-evidence
          path: |
            trivy-image.json
            sbom.cdx.json
          retention-days: 7

  required:
    if: always()
    needs: [application, infrastructure, checkov, filesystem, snyk, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any mandatory gate failed or was unexpectedly skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
          SNYK_ENABLED: ${{ vars.SNYK_ENABLED }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
          const jobs = JSON.parse(process.env.RESULTS);
          for (const name of ["application","infrastructure","checkov","filesystem","image"]) {
            if (jobs[name].result !== "success") throw new Error(`${name}: ${jobs[name].result}`);
          }
          const expected = process.env.SNYK_ENABLED === "true" && process.env.EVENT !== "pull_request";
          if (jobs.snyk.result !== (expected ? "success" : "skipped")) throw new Error("Unexpected Snyk result");
          console.log(expected ? "All gates passed, including Snyk." : "Mandatory gates passed. Snyk NOT RUN; optional credentials not enabled for this event.");
          '
